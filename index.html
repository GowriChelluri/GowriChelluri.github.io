<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Gowri Priya Chelluri — Software Engineer | Frontend & Full Stack</title>
    <meta
      name="description"
      content="Gowri Priya Chelluri is a Software Engineer with experience building scalable web interfaces at Cisco AppDynamics. Frontend engineering, full-stack development and AI-powered applications."
    />
    <meta name="author" content="Gowri Priya Chelluri" />
    <meta name="keywords" content="Gowri Priya Chelluri, Software Engineer, Frontend Developer, Full Stack Developer, Angular, React, TypeScript, Generative AI, Cisco AppDynamics" />
    <meta name="theme-color" content="#07080f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <!-- TODO: after deploying, add your live URL:
    <link rel="canonical" href="https://YOUR-USERNAME.github.io/portfolio/" /> -->

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gowri Priya Chelluri — Software Engineer" />
    <meta
      property="og:description"
      content="Building modern web experiences & intelligent applications. Frontend, full-stack and AI-powered software."
    />
    <meta property="og:image" content="./og-image.svg" />
    <!-- TODO: social platforms need an absolute URL to a PNG/JPG (1200×630). After deploying:
    <meta property="og:url" content="https://YOUR-USERNAME.github.io/portfolio/" />
    <meta property="og:image" content="https://YOUR-USERNAME.github.io/portfolio/og-image.png" /> -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gowri Priya Chelluri — Software Engineer" />
    <meta name="twitter:description" content="Building modern web experiences & intelligent applications." />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gowri Priya Chelluri",
        "jobTitle": "Software Engineer",
        "worksFor": { "@type": "Organization", "name": "Cisco" },
        "sameAs": ["https://linkedin.com/in/gowri-priya-chelluri/"]
      }
    </script>

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">
        This portfolio needs JavaScript. You can also find Gowri Priya Chelluri on
        <a href="https://linkedin.com/in/gowri-priya-chelluri/">LinkedIn</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
